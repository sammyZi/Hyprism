<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Generated by Hyprism. theme.css and config.js are rewritten when the palette changes. -->
  <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>
</head>
<body>
  <div class="bar">
    <div class="left" id="left"></div>
    <div class="center" id="center"></div>
    <div class="right" id="right"></div>
  </div>
  <script type="module">
    import * as zebar from 'https://esm.sh/zebar@3.0';

    const cfg = window.HYPRISM_BAR || {};
    const providers = {
      date: { type: 'date', formatting: cfg.clockFormat || 'EEE d MMM  HH:mm' },
    };
    if (cfg.wm === 'glazewm') providers.glazewm = { type: 'glazewm' };
    if (cfg.wm === 'komorebi') providers.komorebi = { type: 'komorebi' };
    if (cfg.media) providers.media = { type: 'media' };
    if (cfg.battery) providers.battery = { type: 'battery' };
    if (cfg.network) providers.network = { type: 'network' };
    if (cfg.volume) providers.audio = { type: 'audio' };
    if (cfg.cpu) { providers.cpu = { type: 'cpu' }; providers.memory = { type: 'memory' }; }

    const group = zebar.createProviderGroup(providers);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pill = (icon, text, cls = '') => `<span class="pill ${cls}"><i class="nf ${icon}"></i>${esc(text)}</span>`;

    function workspaces(o) {
      if (o.glazewm) {
        return o.glazewm.currentWorkspaces.map(w =>
          `<button class="ws ${w.hasFocus ? 'focused' : ''} ${w.isDisplayed ? 'shown' : ''}" data-ws="${esc(w.name)}">${esc(w.displayName ?? w.name)}</button>`).join('');
      }
      if (o.komorebi) {
        return o.komorebi.currentWorkspaces.map((w, i) =>
          `<span class="ws ${w.name === o.komorebi.focusedWorkspace?.name ? 'focused' : ''}">${esc(w.name ?? i + 1)}</span>`).join('');
      }
      return '';
    }

    function render() {
      const o = group.outputMap;
      $('left').innerHTML = `<span class="logo">◆</span>${cfg.workspaces ? workspaces(o) : ''}`;

      let center = cfg.clock && o.date ? `<span class="clock">${esc(o.date.formatted)}</span>` : '';
      const s = o.media?.currentSession;
      if (s && s.title) center += `<button class="pill media" id="media"><i class="nf ${s.isPlaying ? 'nf-md-pause' : 'nf-md-play'}"></i>${esc(s.title)}${s.artist ? ' · ' + esc(s.artist) : ''}</button>`;
      $('center').innerHTML = center;

      const right = [];
      if (o.cpu) right.push(pill('nf-oct-cpu', Math.round(o.cpu.usage) + '%'));
      if (o.memory) right.push(pill('nf-fae-chip', Math.round(o.memory.usage) + '%'));
      if (o.network) {
        const t = o.network.defaultInterface?.type;
        right.push(pill(t === 'ethernet' ? 'nf-md-ethernet' : t === 'wifi' ? 'nf-md-wifi' : 'nf-md-wifi_off', o.network.defaultGateway?.ssid ?? ''));
      }
      const dev = o.audio?.defaultPlaybackDevice;
      if (dev) right.push(pill(dev.isMuted ? 'nf-md-volume_off' : 'nf-md-volume_high', Math.round(dev.volume) + '%', 'volume'));
      if (o.battery) right.push(pill(o.battery.isCharging ? 'nf-md-battery_charging' : 'nf-md-battery', Math.round(o.battery.chargePercent) + '%'));
      $('right').innerHTML = right.join('');

      document.querySelectorAll('[data-ws]').forEach(b =>
        b.onclick = () => o.glazewm?.runCommand(`focus --workspace ${b.dataset.ws}`));
      const m = document.getElementById('media');
      if (m) m.onclick = () => o.media?.togglePlayPause();
    }

    group.onOutput(render);
    render();
  </script>
</body>
</html>
